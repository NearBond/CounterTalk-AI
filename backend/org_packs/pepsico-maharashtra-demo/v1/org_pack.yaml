# Example data for a second test org, in Maharashtra (batch T3): pepsico-india-demo v1's
# catalog, teams, routing and schemes, with Marathi spellings added as aliases and its own
# distributors. The brand and product names are public product information,
# as sold in India and checked against retailer and company pages on 1 Nov 2026. PepsiCo India is
# not a customer or partner of CounterTalk, and none of this comes from it. There are no logos.
# The teams, contacts, routing, distributors and schemes are made up.
id: pepsico-maharashtra-demo
version: 1
playbook: {id: fmcg-kirana-visit, version: 1}
display_name: PepsiCo India, Maharashtra (example)
sells: >-
  Snacks and drinks sold through neighbourhood shops: potato chips (Lay's, Uncle Chipps), extruded
  snacks (Kurkure, Cheetos), tortilla chips (Doritos), oats (Quaker), soft drinks (Pepsi, 7UP,
  Mountain Dew, Mirinda), an energy drink (Sting), juices and fruit drinks (Tropicana, Slice), a
  lemon drink (Nimbooz), packaged water (Aquafina) and a sports drink (Gatorade).

teams:
  finance:
    name: Finance
    contact: finance@example.com
    handles: >-
      Credit notes, disputed bills, unpaid claims and credit terms; trade scheme benefits that
      didn't reach the shop, scheme payouts and display payments.
  distribution:
    name: Distribution
    contact: distribution@example.com
    handles: >-
      Deliveries, stock-outs and short supply, damaged or near-expiry stock, returns, and
      complaints about a product's quality.
  trade_marketing:
    name: Trade marketing
    contact: trade.marketing@example.com
    handles: >-
      Visibility, coolers, racks and display material; new flavours and products customers ask
      for.
  sales_ops:
    name: Sales operations
    contact: sales.ops@example.com
    handles: >-
      Distributor coverage, the salesmen's beats and visits, shops wanting another distributor;
      pricing, price points and pack sizes, margins and channel conflict.
  area_manager:
    name: Area manager
    contact: area.manager@example.com
    handles: >-
      Serious problems that put a shop at risk, such as a high-severity payment dispute; and the
      shopkeeper's praise.

# Each playbook category's team, as the user decided on 1 Nov: Appendix A's "team that usually
# acts" where it's one of these five (schemes go to finance, which pays them out: K6 P1), and the
# nearest of the five where it isn't. Only other goes to triage, where the AI's team suggestion
# helps a person pick.
routing:
  schemes: finance
  pricing: sales_ops
  supply: distribution
  damage: distribution
  payments: finance
  quality: distribution
  demand: trade_marketing
  servicing: sales_ops
  visibility: trade_marketing
  praise: area_manager

# At most one per category, so an insight has at most 2 teams (batch 12).
overrides:
  - category: payments
    min_severity: high
    team: area_manager

# What speech-to-text listens for, and whose number words the quote checker reads.
languages: [mr, hi, en]

catalog:
  skus: skus.csv
  competitors: competitors.csv
  schemes: schemes.csv
  distributors: distributors.csv
