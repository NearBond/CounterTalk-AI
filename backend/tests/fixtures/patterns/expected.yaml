    W5: {label: new, shops_in_week: 2}
    W6:
      label: growing
      shops_in_week: 3  # A, C and D
      insights_in_week: 3  # C, D and A again
      reps_in_week: 2
      baseline: 0.5  # W2-W5: 0, 0, 0, 2
      open_shops: 4  # A-D
      raised_again: 1  # A, on two visits
      age_weeks: 1
      score: 24  # 3 x 4 x (1 + 1)
      finance_rank: 1
  P1_E:
    W6: {label: new, open_shops: 1, age_weeks: 0, score: 3}  # 3 x 1 x (1 + 0): first seen in W6
  P2:
    W5: {label: steady, shops_in_week: 2}
    W6: {label: growing, shops_in_week: 4, baseline: 1.0, open_shops: 8, age_weeks: 3, score: 64, distribution_rank: 1}
  P3:
    W5: {label: recurring}
    W6: {label: recurring, open_shops: 1, age_weeks: 4, score: 15, finance_rank: 2}
