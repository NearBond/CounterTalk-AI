name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    # The image's base, with Debian's ffmpeg (7.1), so the audio tests run what production runs.
    container: python:3.12-slim
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: countertalk
          POSTGRES_PASSWORD: countertalk
          POSTGRES_DB: countertalk
        options: >-
          --health-cmd "pg_isready -U countertalk -d countertalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # From inside the job's container, the service is reached by its name.
      TEST_POSTGRES_HOST: postgres
      # The container's cache and venv are on different filesystems: uv copies, quietly.
      UV_LINK_MODE: copy
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg from Debian, as in the image
        run: apt-get update -q && apt-get install -y -q --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Creates and migrates countertalk_test on the service above (tests/conftest.py).
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --pull -t countertalk:ci .
      # The image starts ./scripts/start.sh, so git must have kept its executable bit.
      - name: start.sh is executable in the image
        run: docker run --rm --entrypoint test countertalk:ci -x scripts/start.sh

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The CLI from its image: gitleaks-action needs a paid licence for organisation repos.
      - name: Scan every commit for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  repo-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Nothing git-ignored is tracked (docs, env files, data, audio, builds)
        run: |
          bad=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$bad" ]; then echo "Tracked but git-ignored:"; echo "$bad"; exit 1; fi
